document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

 */\n  --color-neutral-100: #f9f4ed;\n  --color-neutral-200: #eee7db;\n  --color-neutral-300: #dcd3c4;\n  --color-neutral-400: #c0b6a5;\n  --color-neutral-500: #a19786;\n  --color-neutral-600: #82796a;\n  --color-neutral-700: #645c50;\n  --color-neutral-800: #474238;\n  --color-neutral-900: #2e2b25;\n\n  --color-accent-100: #fff2eb;\n  --color-accent-200: #ffe1d0;\n  --color-accent-300: #ffc6a5;\n  --color-accent-400: #f6a06b;\n  --color-accent-500: #d67f48;\n  --color-accent-600: #b2622d;\n  --color-accent-700: #8c491a;\n  --color-accent-800: #643312;\n  --color-accent-900: #402310;\n\n  --color-accent-2-100: #f0fae1;\n  --color-accent-2-200: #e1eecc;\n  --color-accent-2-300: #ccdbb2;\n  --color-accent-2-400: #aebf92;\n  --color-accent-2-500: #8fa073;\n  --color-accent-2-600: #728157;\n  --color-accent-2-700: #56633f;\n  --color-accent-2-800: #3d472b;\n  --color-accent-2-900: #272e1b;\n\n  --font-heading: \"Caprasimo\", system-ui, sans-serif;\n  --font-heading-weight: 400;\n  --font-body: \"Figtree\", system-ui, sans-serif;\n\n  --space-1: 4.4px;\n  --space-2: 8.8px;\n  --space-3: 13.2px;\n  --space-4: 17.6px;\n  --space-6: 26.4px;\n  --space-8: 35.2px;\n\n  --radius-sm: 8px;\n  --radius-md: 16px;\n  --radius-lg: 28px;\n\n  /* Elevation — derived from the ground: soft ink-tinted shadows on a\n     light theme, a hairline edge + ambient darkness on a dark one. */\n  --shadow-sm: 0 1px 2px color-mix(in srgb, #2e2b25 14%, transparent);\n  --shadow-md: 0 3px 10px color-mix(in srgb, #2e2b25 16%, transparent);\n  --shadow-lg: 0 12px 32px color-mix(in srgb, #2e2b25 22%, transparent);\n}\n\nbody {\n  background: var(--color-bg);\n  color: var(--color-text);\n  font-family: var(--font-body);\n}\nh1, h2, h3, h4 { font-family: var(--font-heading); font-weight: var(--font-heading-weight); }\n\n.washed{filter:saturate(0.6) contrast(0.85) brightness(1.1) opacity(0.94)}\n\n/* ══════════════════════════════════════════════════════════════════════════\n   Components — built with the tokens above. Plain CSS\n   on plain HTML: no JavaScript, no build step. Each class is documented in\n   readme.md and demonstrated in foundations/ and components/.\n   ══════════════════════════════════════════════════════════════════════ */\n\n*, *::before, *::after { box-sizing: border-box; }\nbody { margin: 0; font-size: 15px; line-height: 1.55; font-weight: 400; }\nh1, h2, h3, h4, h5, h6 {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  line-height: 1.12; letter-spacing: -0.015em; margin: 0 0 var(--space-2);\n}\nh1 { font-size: 42px; }\nh2 { font-size: 32px; }\nh3 { font-size: 25px; }\nh4 { font-size: 20px; }\nh5 { font-size: 16px; }\nh6 { font-size: 13px; }\nh6 { letter-spacing: 0.08em; text-transform: uppercase; }\np { margin: 0 0 var(--space-3); }\na { color: var(--color-accent); text-underline-offset: 3px; }\nimg { display: block; max-width: 100%; }\nfigure { margin: 0; }\nfigcaption {\n  font-size: 11px; margin-top: var(--space-1);\n  color: color-mix(in srgb, var(--color-text) 55%, transparent);\n}\n.text-muted { color: color-mix(in srgb, var(--color-text) 55%, transparent); }\n:focus { outline: none; }\n:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n::selection { background: color-mix(in srgb, var(--color-accent) 30%, transparent); }\n\n/* — rules — */\n.hr {\n  height: 1px; border: 0; margin: var(--space-4) 0;\n  background: var(--color-divider);\n}\n\n/* — buttons — */\n.btn {\n  display: inline-flex; align-items: center; justify-content: center; gap: 6px;\n  cursor: pointer; text-decoration: none;\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 14px; line-height: 1.2; color: var(--color-text); /* matches the .input's 14px —\n     the pair sits side by side in sign-up rows */\n  background: transparent; border: 1px solid transparent;\n  padding: var(--space-2) calc(var(--space-3) * 1.2);\n  border-radius: var(--radius-md);\n}\n.btn svg { display: block; }\n.btn:disabled { opacity: 0.45; cursor: not-allowed; }\n.btn-primary { background: var(--color-accent); color: var(--color-bg); }\n.btn-primary:hover { background: var(--color-accent-600); }\n.btn-primary:active { background: var(--color-accent-700); }\n.btn-secondary { border-color: var(--color-divider); }\n.btn-secondary:hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.btn-secondary:active { background: color-mix(in srgb, var(--color-text) 14%, transparent); }\n.btn-ghost { color: var(--color-accent); padding-inline: var(--space-1); }\n.btn-ghost:hover { background: color-mix(in srgb, var(--color-accent) 10%, transparent); }\n.btn-ghost:active { background: color-mix(in srgb, var(--color-accent) 18%, transparent); }\n.btn-icon { width: 36px; height: 36px; padding: 0; }\n.btn-block { width: 100%; margin-top: var(--space-2); }\n\n/* — forms — */\n.field > label {\n  display: block; font-size: 12px; margin-bottom: 5px;\n  color: color-mix(in srgb, var(--color-text) 70%, transparent);\n}\n.input {\n  width: 100%; min-height: 36px; padding: 6px 10px; font: inherit;\n  font-size: 14px; color: var(--color-text); caret-color: var(--color-accent);\n  background: var(--color-surface);\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.input:hover { border-color: color-mix(in srgb, var(--color-text) 45%, transparent); }\n.input:focus-visible { border-color: var(--color-accent); outline-offset: 0; }\ntextarea.input { min-height: 90px; resize: vertical; }\n.radio { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; }\n.radio input, .seg-opt input {\n  position: absolute; opacity: 0; width: 0; height: 0; pointer-events: none;\n}\n.radio .dot {\n  width: 16px; height: 16px; flex: none; border-radius: 50%;\n  border: 1.5px solid var(--color-divider);\n}\n.radio:hover .dot { border-color: var(--color-accent); }\n.radio input:checked + .dot {\n  border-color: var(--color-accent); background: var(--color-accent);\n  box-shadow: inset 0 0 0 4px var(--color-bg);\n}\n.radio input:focus-visible + .dot { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n.seg {\n  display: inline-flex; overflow: hidden;\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.seg-opt {\n  display: inline-flex; align-items: center; gap: 6px;\n  padding: 7px 12px; font-size: 13px; cursor: pointer;\n}\n.seg-opt + .seg-opt { border-left: 1px solid var(--color-divider); }\n.seg-opt:has(input:checked) { background: var(--color-accent); color: var(--color-bg); }\n.seg-opt:not(:has(input:checked)):hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.seg-opt:has(input:focus-visible) { outline: 2px solid var(--color-accent); outline-offset: -2px; }\n\n/* — cards — */\n.card {\n  display: flex; flex-direction: column; gap: var(--space-2);\n  padding: var(--space-3); border-radius: var(--radius-md); background: var(--color-surface);\n}\n.card-kicker { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-accent); }\n.card-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 17px; line-height: 1.2;\n}\n.card-body { margin: 0; font-size: 13px; opacity: 0.8; flex: 1; }\n.card-meta {\n  display: flex; align-items: center; gap: 6px; font-size: 11px;\n  color: color-mix(in srgb, var(--color-text) 50%, transparent);\n}\n.elev-sm { box-shadow: var(--shadow-sm); }\n.elev-md { box-shadow: var(--shadow-md); }\n.elev-lg { box-shadow: var(--shadow-lg); }\n\n/* — tags — */\n.tag {\n  display: inline-flex; align-items: center; font-size: 11px;\n  letter-spacing: 0.02em; padding: 3px 10px;\n  border-radius: calc(var(--radius-md) * 0.75);\n}\n.tag-accent { background: var(--color-accent-100); color: var(--color-accent-800); }\n.tag-accent-2 { background: var(--color-accent-2-100); color: var(--color-accent-2-800); }\n.tag-neutral { background: v gap: 18px; background: var(--color-accent-2-200); border: 3px solid var(--color-accent-900); border-radius: 999px; padding: 14px 24px; margin-left: clamp(0px, 6vw, 72px);\">\n          <span style=\"font-family: var(--font-heading); font-size: 30px; line-height: 1; color: var(--color-accent-2-800);\">3<\u002Fspan>\n          <span style=\"font-size: 16px; font-weight: 600;\">Nobody wins. Repeat tomorrow.<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"product\" style=\"max-width: 1600px; margin: 0 auto; padding: clamp(28px, 4vw, 48px) clamp(20px, 5vw, 56px);\">\n    <div style=\"max-width: 1600px; margin: 0 auto; position: relative; background: var(--color-accent-2-200); background-image: radial-gradient(var(--color-accent-2-300) 2.5px, transparent 2.6px); background-size: 22px 22px; border: 3px solid var(--color-accent-900); border-radius: 36px; box-shadow: 9px 9px 0 var(--color-accent-900); padding: clamp(28px, 5vw, 64px); display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: clamp(24px, 4vw, 56px); align-items: center;\">\n      <div>\n        <span style=\"display: inline-block; background: var(--color-accent-900); color: var(--color-neutral-100); border-radius: 999px; padding: 5px 16px; font-size: 12px; font-weight: 800; letter-spacing: 0.12em; text-transform: uppercase;\">The product<\u002Fspan>\n        <h2 style=\"font-family: var(--font-heading); font-weight: 400; font-size: clamp(34px, 5vw, 60px); line-height: 1.0; margin: 20px 0 0; color: var(--color-accent-2-900);\">Build it.<br>Stack it.<br><span style=\"display: inline-block; background: var(--color-accent-600); color: var(--color-bg); border: 3px solid var(--color-accent-900); border-radius: 14px; padding: 2px 16px 6px; transform: rotate(-2deg);\">Eat it.<\u002Fspan><\u002Fh2>\n        <p style=\"font-size: 19px; line-height: 32px; margin: 20px 0 0; max-width: 40ch; color: var(--color-accent-2-900);\">A food bite the size of a Duplo brick, with studs that <em style=\"font-style: normal; font-weight: 800; text-decoration: underline; text-decoration-thickness: 3px; text-underline-offset: 4px; text-decoration-color: var(--color-accent-600);\">actually interlock<\u002Fem>. Kids stack a tower, then eat the tower. Every brick is identical: real ingredients, chocolate and cinnamon, one fixed nutrient count.<\u002Fp>\n        <div style=\"display: flex; flex-wrap: wrap; gap: 10px; margin-top: 26px;\">\n          <span class=\"nb-cube\" style=\"background: var(--color-bg); border: 3px solid var(--color-accent-900); border-radius: 999px; padding: 8px 18px; font-size: 14px; font-weight: 800;\">Nut-free<\u002Fspan>\n          <span class=\"nb-cube\" style=\"background: var(--color-bg); border: 3px solid var(--color-accent-900); border-radius: 999px; padding: 8px 18px; font-size: 14px; font-weight: 800;\">No gelatine<\u002Fspan>\n          <span class=\"nb-cube\" style=\"background: var(--color-bg); border: 3px solid var(--color-accent-900); border-radius: 999px; padding: 8px 18px; font-size: 14px; font-weight: 800;\">No junk bricks<\u002Fspan>\n          <span class=\"nb-cube\" style=\"background: var(--color-bg); border: 3px solid var(--color-accent-900); border-radius: 999px; padding: 8px 18px; font-size: 14px; font-weight: 800;\">Made to play with<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"position: relative;\">\n        <div id=\"nb-stack-3d\" aria-hidden=\"true\" style=\"width: 100%; height: clamp(320px, 40vw, 460px); display: none;\"><\u002Fdiv>\n        <div id=\"nb-stack-fallback\" style=\"display: grid; gap: 10px; justify-items: center;\">\n          <span style=\"width: 150px; height: 74px; border-radius: 14px; background: linear-gradient(160deg, var(--color-accent-700), var(--color-accent-900)); border: 3px solid var(--color-accent-900);\"><\u002Fspan>\n          <span style=\"width: 150px; height: 74px; border-radius: 14px; background: linear-gradient(160deg, var(--color-accent-700), var(--color-accent-900)); border: 3px solid var(--color-accent-900);\"><\u002Fspan>\n          <span style=\"width: 150px; height: 74px; border-radius: 14px; background: linear-gradient(160deg, var(--color-accent-700), var(--color-accent-900)); border: 3px solid var(--color-accent-900);\"><\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section style=\"max-width: 1600px; margin: 0 auto; padding: clamp(28px, 4vw, 48px) clamp(20px, 5vw, 56px);\">\n    <span style=\"display: inline-block; background: var(--color-accent-900); color: var(--color-neutral-100); border-radius: 999px; padding: 5px 16px; font-size: 12px; font-weight: 800; letter-spacing: 0.12em; text-transform: uppercase;\">Why it is different<\u002Fspan>\n    <h2 style=\"font-family: var(--font-heading); font-weight: 400; font-size: clamp(32px, 4.6vw, 56px); line-height: 1.02; margin: 20px 0 clamp(28px, 4vw, 48px); max-width: 18ch;\">Food shaped like a toy, not food in a wrapper.<\u002Fh2>\n    <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 20px;\">\n      <div style=\"background: var(--color-accent-100); border: 3px solid var(--color-accent-900); border-radius: 24px; box-shadow: 5px 5px 0 var(--color-accent-900); padding: 26px; display: grid; gap: 10px; align-content: start; transition: transform 200ms cubic-bezier(0.2, 0.7, 0.2, 1), box-shadow 200ms ease;\" style-hover=\"transform: translate(-3px, -3px); box-shadow: 9px 9px 0 var(--color-accent-900);\">\n        <span style=\"font-family: var(--font-heading); font-size: 40px; line-height: 1; color: var(--color-accent-500);\">01<\u002Fspan>\n        <span style=\"justify-self: start; background: var(--color-bg); border: 2px solid var(--color-accent-900); border-radius: 999px; padding: 3px 12px; font-size: 12px; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-accent-800);\">Materials<\u002Fspa ; margin: 0;\"><strong style=\"font-weight: 800;\">100% of the plate is healthy and fun.<\u002Fstrong> No junk bricks mixed in, so there is nothing to negotiate around.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section style=\"max-width: 1600px; margin: 0 auto; padding: clamp(28px, 4vw, 48px) clamp(20px, 5vw, 56px);\">\n    <div style=\"background: var(--color-accent-900); background-image: radial-gradient(var(--color-accent-800) 2.5px, transparent 2.6px); background-size: 22px 22px; color: var(--color-neutral-100); border-radius: 36px; padding: clamp(26px, 4vw, 48px);\">\n      <h2 style=\"font-family: var(--font-heading); font-weight: 400; font-size: clamp(26px, 3.4vw, 40px); line-height: 1.05; margin: 0; max-width: 20ch;\">The snack aisle, honestly compared.<\u002Fh2>\n      <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 16px; margin-top: 30px;\">\n        <div class=\"nb-lift\" style=\"border: 2px solid var(--color-accent-700); border-radius: 24px; padding: 22px; display: grid; gap: 12px; align-content: start;\">\n          <span style=\"display: grid; place-content: center; width: 44px; height: 44px; border-radius: 50%; background: var(--color-accent-800); font-family: var(--font-heading); font-size: 22px; color: var(--color-accent-300);\">✕<\u002Fspan>\n          <p style=\"font-size: 12px; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase; margin: 0; color: var(--color-accent-300);\">Frozen kid meals<\u002Fp>\n          <p style=\"font-size: 16px; line-height: 27px; margin: 0; color: color-mix(in srgb, var(--color-neutral-100) 86%, transparent);\">Need a freezer, a microwave and <strong style=\"font-weight: 800; color: var(--color-neutral-100);\">twelve minutes you do not have<\u002Fstrong>.<\u002Fp>\n        <\u002Fdiv>\n        <div class=\"nb-lift\" style=\"border: 2px solid var(--color-accent-700); border-radius: 24px; padding: 22px; display: grid; gap: 12px; align x; color: var(--color-neutral-100);\"><span style=\"display: grid; place-content: center; width: 19px; height: 19px; border-radius: 50%; background: var(--color-accent-900); font-size: 11px;\">✕<\u002Fspan>None<\u002Fspan><\u002Fdiv>\n            <div class=\"nb-neg\" style=\"display: flex; align-items: baseline; justify-content: space-between; gap: 16px; padding: 11px 10px; border-bottom: 2px solid var(--color-accent-700);\"><span style=\"font-size: 15.5px;\">Artificial colours<\u002Fspan><span style=\"flex: none; display: flex; align-items: center; gap: 7px; background: var(--color-accent-700); border-radius: 999px; padding: 3px 12px 3px 6px; font-family: var(--font-heading); font-size: 15px; color: var(--color-neutral-100);\"><span style=\"display: grid; place-content: center; width: 19px; height: 19px; border-radius: 50%; background: var(--color-accent-900); font-size: 11px;\">✕<\u002Fspan>None<\u002Fspan><\u002Fdiv>\n            <div class=\"nb-neg\" style=\"display: flex; align-items: baseline; justify-content: space-between; gap: 16px; padding: 11px 10px; border-bottom: 2px solid var(--color-accent-700);\"><span style=\"font-size: 15.5px;\">Junk bricks in the pack<\u002Fspan><span style=\"flex: none; display: flex; align-items: center; gap: 7px; background: var(--color-accent-700); border-radius: 999px; padding: 3px 12px 3px 6px; font-family: var(--font-heading); font-size: 15px; color: var(--color-neutral-100);\"><span style=\"display: grid; place-content: center; width: 19px; height: 19px; border-radius: 50%; background: var(--color-accent-900); font-size: 11px;\">✕<\u002Fspan>None<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n          <p style=\"display: flex; align-items: center; gap: 10px; font-size: 13px; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; margin: 18px 0 0; color: var(--color-accent-300);\"><span style=\"display: grid; place-content: center; width: 24px; height: 24px; border-radius: 50%; background: var(--color-accent-2-500); color: var(--color-accent-2-900); font-size: 13px;\">✓<\u002Fspan>Seven ingredients, nothing hidden<\u002Fp>\n        <\u002Fdiv><div style=\"grid-column: 1 / -1; background: var(--color-accent-2-100); border: 3px solid var(--color-accent-900); border-radius: 36px; box-shadow: 5px 5px 0 var(--color-accent-900); padding: clamp(24px, 4vw, 38px);\">\n          <span style=\"display: inline-block; background: var(--color-accent-2-400); border: 2px solid var(--color-accent-900); border-radius: 999px; padding: 3px 12px; font-size: 12px; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-accent-2-900); margin-bottom: 14px;\">Small stomachs<\u002Fspan>\n          <h3 style=\"font-family: var(--font-heading); font-weight: 400; font-size: 28px; line-height: 1.1; margin: 0;\">Why nutrient density matters<\u002Fh3>\n          <p style=\"font-size: 16px; line-height: 27px; margin: 16px 0 0;\">Small kids have small stomachs and big nutrient needs, so every bite has to work harder than an adult's does. A dense snack fills a real gap <strong style=\"font-weight: 800;\">on the days the vegetables lose<\u002Fstrong>.<\u002Fp>\n          <p style=\"font-size: 15.5px; line-height: 26px; margin: 14px 0 0;\">NutriBrick is a snack, not a meal replacement, and not a substitute for advice from your GP or a dietitian.<\u002Fp>\n          <p style=\"font-size: 12px; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase; margin: 18px 0 0; color: var(--color-accent-2-700);\">General information, not medical advice<\u002Fp>\n        <\u002Fdiv><\u002Fdiv>\n  <\u002Fsection>\n\n  <section style=\"max-width: 1600px; margin: 0 auto; padding: clamp(28px, 4vw, 48px) clamp(20px, 5vw, 56px);\">\n    <span style=\"display: inline-block; background: var(--color-accent-900); color: var(--color-neutral-100); border-radius: 999px; padding: 5px 16px; font-size: 12px; font-weight: 800; letter-spacing: 0.12em; text-transform: uppercase;\">How it is made lor-accent-200) 2.2px, transparent 2.3px); background-size: 18px 18px; border: 3px solid var(--color-accent-900); border-radius: 24px; box-shadow: 5px 5px 0 var(--color-accent-900); padding: 26px; display: grid; gap: 16px; justify-items: start; align-content: start;\">\n        <span class=\"nb-step-num\" style=\"display: grid; place-content: center; width: 68px; height: 68px; border-radius: 50%; background: var(--color-accent-400); border: 3px solid var(--color-accent-900); font-family: var(--font-heading); font-size: 28px; color: var(--color-accent-900);\">2<\u002Fspan>\n        <span style=\"display: flex; align-items: center; gap: 8px; font-size: 11px; font-weight: 800; letter-spacing: 0.12em; text-transform: uppercase; color: var(--color-accent-700);\">Press<span style=\"width: 28px; height: 14px; border-radius: 5px; border: 3px dashed var(--color-accent-600);\"><\u002Fspan><\u002Fspan>\n        <p style=\"font-size: 16px; line-height: 27px; margin: 0;\">Pressed into a Duplo-brick-shaped mould, <strong style=\"font-weight: 800;\">studs and all<\u002Fstrong>.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"nb-step nb-hov\" style=\"background: var(--color-accent-2-100); background-image: radial-gradient(var(--color-accent-2-200) 2.2px, transparent 2.3px); background-size: 18px 18px; border: 3px solid var(--color-accent-900); border-radius: 24px; box-shadow: 5px 5px 0 var(--color-accent-900); padding: 26px; display: grid; gap: 16px; justify-items: start; align-content: start;\">\n        <span class=\"nb-step-num\" style=\"display: grid; place-content: center; width: 68px; height: 68px; border-radius: 50%; background: var(--color-accent-2-300); border: 3px solid var(--color-accent-900); font-family: var(--font-heading); font-size: 28px; color: var(--color-accent-2-900);\">3<\u002Fspan>\n        <span style=\"display: flex; align-items: center; gap: 8px; font-size: 11px; font-weight: 800; letter-spacing: 0.12em; text-transform: uppercase; color: var(--color-accent- max-width: 1600px; margin: 0 auto; padding: clamp(28px, 4vw, 48px) clamp(20px, 5vw, 56px);\">\n    <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px;\">\n      <div class=\"nb-hov\" style=\"background: var(--color-accent-100); border: 3px solid var(--color-accent-900); border-radius: 24px; box-shadow: 5px 5px 0 var(--color-accent-900); padding: 24px 26px; display: grid; gap: 10px; align-content: start;\">\n        <span style=\"justify-self: start; background: var(--color-accent-400); border: 2px solid var(--color-accent-900); border-radius: 999px; padding: 3px 12px; font-size: 11px; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-accent-900);\">8am<\u002Fspan>\n        <p style=\"font-family: var(--font-heading); font-weight: 400; font-size: 23px; line-height: 1.12; margin: 0;\">In the lunchbox<\u002Fp>\n        <p style=\"font-size: 15.5px; line-height: 26px; margin: 0;\"><strong style=\"font-weight: 800;\">Nut-free<\u002Fstrong>, so it clears the school gate. Holds its shape until recess.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"nb-hov\" style=\"background: var(--color-accent-100); border: 3px solid var(--color-accent-900); border-radius: 24px; box-shadow: 5px 5px 0 var(--color-accent-900); padding: 24px 26px; display: grid; gap: 10px; align-content: start;\">\n        <span style=\"justify-self: start; background: var(--color-accent-400); border: 2px solid var(--color-accent-900); border-radius: 999px; padding: 3px 12px; font-size: 11px; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-accent-900);\">4pm<\u002Fspan>\n        <p style=\"font-family: var(--font-heading); font-weight: 400; font-size: 23px; line-height: 1.12; margin: 0;\">After school<\u002Fp>\n        <p style=\"font-size: 15.5px; line-height: 26px; margin: 0;\">One brick bridges the gap to dinner <strong style=\"font-weight: 800;\">without wrecking their appetite<\u002Fstrong>.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"nb-hov\" style=\"background: var(--color-accent-2-100); border: 3px solid var(--color-accent-900); border-radius: 24px; box-shadow: 5px 5px 0 var(--color-accent-900); padding: 24px 26px; display: grid; gap: 10px; align-content: start;\">\n        <span style=\"justify-self: start; background: var(--color-accent-2-400); border: 2px solid var(--color-accent-900); border-radius: 999px; padding: 3px 12px; font-size: 11px; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-accent-2-900);\">Anytime<\u002Fspan>\n        <p style=\"font-family: var(--font-heading); font-weight: 400; font-size: 23px; line-height: 1.12; margin: 0;\">Out of the house<\u002Fp>\n        <p style=\"font-size: 15.5px; line-height: 26px; margin: 0;\">Car trips, waiting rooms, long queues. <strong style=\"font-weight: 800;\">A snack and a toy in one pocket.<\u002Fstrong><\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <sc-if value=\"{{ showTestimonial }}\" hint-placeholder-val=\"{{ true }}\">\n    <section style=\"max-width: 1600px; margin: 0 auto; padding: clamp(28px, 4vw, 48px) clamp(20px, 5vw, 56px);\">\n      <div style=\"position: relative; background: var(--color-accent-2-500); background-image: radial-gradient(var(--color-accent-2-600) 2.5px, transparent 2.6px); background-size: 22px 22px; border: 3px solid var(--color-accent-900); border-radius: 36px; box-shadow: 9px 9px 0 var(--color-accent-900); padding: clamp(28px, 5vw, 60px); display: flex; flex-wrap: wrap; gap: clamp(24px, 4vw, 48px); align-items: center;\">\n        <figure style=\"margin: 0; flex: 1 1 420px; max-width: 640px;\">\n          <blockquote style=\"font-family: var(--font-heading); font-weight: 400; font-size: clamp(26px, 4vw, 46px); line-height: 1.1; margin: 0; color: var(--color-accent-2-900);\">\"He built a tower, called it a lighthouse, then ate the lighthouse.\"<\u002Fblockquote>\n          <figcaption style=\"font-size: 14px; line-height: 24px; margin: 24px 0 0; font-weight: 600; color: var(--color-accent-2-900);\">Illustrative example written for this pitch, not a real customer review.<\u002Ffigcaption>\n        <\u002Ffigure>\n        <div style=\"flex: 1 1 280px; display: grid; justify-items: center;\">\n          <div id=\"nb-tower-3d\" aria-hidden=\"true\" style=\"width: 100%; height: clamp(300px, 34vw, 400px); display: none;\"><\u002Fdiv>\n          <div id=\"nb-tower-fallback\" style=\"display: grid; justify-items: center;\" aria-hidden=\"true\">\n            <span style=\"position: relative; width: 56px; height: 34px; border-radius: 12px 12px 6px 6px; background: var(--color-accent-300); border: 3px solid var(--color-accent-900); animation: nb-lamp 2.6s ease-in-out infinite;\"><\u002Fspan>\n            <span style=\"width: 86px; height: 46px; margin-top: -3px; border-radius: 14px; background: linear-gradient(150deg, var(--color-accent-700), var(--color-accent-900)); border: 3px solid var(--color-accent-900);\"><\u002Fspan>\n            <span style=\"width: 98px; height: 46px; margin-top: -3px; border-radius: 14px; background: linear-gradient(150deg, var(--color-accent-600), var(--color-accent-800)); border: 3px solid var(--color-accent-900);\"><\u002Fspan>\n            <span style=\"width: 112px; height: 46px; margin-top: -3px; border-radius: 12px 12px 16px 16px; background: linear-gradient(150deg, var(--color-accent-700), var(--color-accent-900)); border: 3px solid var(--color-accent-900);\"><\u002Fspan>\n          <\u002Fdiv>\n          <span style=\"margin-top: 6px; background: var(--color-accent-2-200); border: 3px solid var(--color-accent-900); border-radius: 999px; padding: 5px 14px; font-size: 11px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; color: var(--color-accent-2-900);\">The lighthouse in question<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n  <\u002Fsc-if>\n\n  <section id=\"pricing\" style=\"max-width: 1600px; margin: 0 auto; padding: clamp(28px, 4vw, 48px) clamp(20px, 5vw, 56px);\">\n    <div style=\"max-width: 1600px; margin: 0 auto; background: var(--color-accent-200); background-image: radial-gradient(var(--color-accent-300) 2.5px, transparent 2.6px); background-size: 22px 22px; border: 3px solid var(--color-accent-900); border-radius: 36px; box-shadow: 9px 9px 0 var(--color-accent-900); padding: clamp(28px, 5vw, 64px); display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: clamp(24px, 4vw, 56px); align-items: center;\">\n      <div>\n        <span style=\"display: inline-block; background: var(--color-accent-900); color: var(--color-neutral-100); border-radius: 999px; padding: 5px 16px; font-size: 12px; font-weight: 800; letter-spacing: 0.12em; text-transform: uppercase;\">Pricing<\u002Fspan>\n        <div style=\"display: flex; align-items: flex-start; gap: 6px; margin-top: 18px;\">\n          <span style=\"font-family: var(--font-heading); font-size: clamp(32px, 4vw, 46px); line-height: 1; color: var(--color-accent-900); margin-top: 8px;\">$<\u002Fspan>\n          <span style=\"font-family: var(--font-heading); font-size: clamp(64px, 10vw, 116px); line-height: 0.85; color: var(--color-accent-900);\">2.00<\u002Fspan>\n          <span style=\"align-self: flex-end; font-size: 14px; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-accent-800); padding-bottom: 10px;\">per brick<\u002Fspan>\n        <\u002Fdiv>\n        <p style=\"font-size: 19px; line-height: 32px; margin: 18px 0 0; max-width: 36ch; color: var(--color-accent-900);\">Planned as packs of seven, a week of snacks for <strong style=\"font-weight: 800; background: var(--color-bg); border-radius: 8px; padding: 0 6px; margin-right: -4px;\">$14.00<\u002Fstrong>. No subscription, no freezer space, no leftovers to scrape.<\u002Fp>\n        <div style=\"display: flex; flex-wrap: wrap; gap: 14px; margin-top: 26px; align-items: center;\">\n          <sc-if value=\"{{ isStore }}\" hint-placeholder-val=\"{{ false }}\"><a href=\"#top\" class=\"btn btn-primary\" style=\"border: 3px solid var(--color-accent-900); box-shadow: 5px 5px 0 var(--color-accent-900); font-weight: 700;\">Get NutriBrick<\u002Fa><\u002Fsc-if>\n          <sc-if value=\"{{ isPitch }}\" hint-placeholder-val=\"{{ true }}\"><span class=\"btn btn-primary\" style=\"border: 3px solid var(--color-accent-900); box-shadow: 5px 5px 0 var(--color-accent-900); font-weight: 700; pointer-events: none;\">Coming soon<\u002Fspan><\u002Fsc-if>\n          <span style=\"font-size: 15px; font-weight: 600; color: var(--color-accent-900);\">The plan: launch first at your local grocer.<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display: grid; gap: 14px; justify-items: center;\">\n        <div style=\"background: var(--color-bg); border: 3px solid var(--color-accent-900); border-radius: 24px; box-shadow: 5px 5px 0 var(--color-accent-900); padding: 24px;\">\n          <div style=\"display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; max-width: 252px;\">\n            <span class=\"nb-cube\" style=\"display: grid; gap: 5px; justify-items: center; align-content: start; width: 54px; padding: 6px 0 10px; border-radius: 14px; background: linear-gradient(160deg, var(--color-accent-700), var(--color-accent-900)); border: 3px solid var(--color-accent-900);\"><span style=\"display: flex; gap: 6px;\"><span style=\"width: 9px; height: 9px; border-radius: 50%; background: var(--color-accent-600);\"><\u002Fspan><span style=\"width: 9px; height: 9px; border-radius: 50%; background: var(--color-accent-600);\"><\u002Fspan><\u002Fspan><span style=\"font-size: 9px; font-weight: 800; letter-spacing: 0.06em; color: var(--color-accent-300);\">MON<\u002Fspan><\u002Fspan>\n            <span class=\"nb-cube\" style=\"display: grid; gap: 5px; justify-items: center; align-content: start; width: 54px; padding: 6px 0 10px; border-radius: 14px; background: linear-gradient(160deg, var(--color-accent-700), var(--color-accent-900)); border: 3px solid var(--color-accent-900);\"><span style=\"display: flex; gap: 6px;\"><span style=\"width: 9px; height: 9px; border-radius: 50%; background: var(--color-accent-600);\"><\u002Fspan><span style=\"width: 9px; height: 9px; border-radius: 50%; background: var(--color-accent-600);\"><\u002Fspan><\u002Fspan><span style=\"font-size: 9px; font-weight: 800; letter-spacing: 0.06em; color: var(--color-accent-300);\">TUE<\u002Fspan><\u002Fspan>\n            <span class=\"nb-cube\" style=\"display: grid; gap: 5px; justify-items: center; align-content: start; width: 54px; padding: 6px 0 10px; border-radius: 14px; background: linear-gradient(160deg, var(--color-accent-700), var(--color-accent-900)); border: 3px solid var(--color-accent-900);\"><span style=\"display: flex; gap: 6px;\"><span style=\"width: 9px; height: 9px; border-radius: 50%; background: var(--color-accent-600);\"><\u002Fspan><span style=\"width: 9px; height: 9px; border-radius: 50%; background: var(--color-accent-600);\"><\u002Fspan><\u002Fspan><span style=\"font-size: 9px; font-weight: 800; letter-spacing: 0.06em; color: var(--color-accent-300);\">WED<\u002Fspan><\u002Fspan>\n            <span class=\"nb-cube\" style=\"display: grid; gap: 5px; justify-items: center; align-content: start; width: 54px; padding: 6px 0 10px; border-radius: 14px; background: linear-gradient(160deg, var(--color-accent-700), var(--color-accent-900)); border: 3px solid var(--color-accent-900);\"><span style=\"display: flex; gap: 6px;\"><span style=\"width: 9px; height: 9px; border-radius: 50%; background: var(--color-accent-600);\"><\u002Fspan><span style=\"width: 9px; height: 9px; border-radius: 50%; background: var(--color-accent-600);\"><\u002Fspan><\u002Fspan><span style=\"font-size: 9px; font-weight: 800; letter-spacing: 0.06em; color: var(--color-accent-300);\">THU<\u002Fspan><\u002Fspan>\n            <span class=\"nb-cube\" style=\"display: grid; gap: 5px; justify-items: center; align-content: start; width: 54px; padding: 6px 0 10px; border-radius: 14px; background: linear-gradient(160deg, var(--color-accent-700), var(--color-accent-900)); border: 3px solid var(--color-accent-900);\"><span style=\"display: flex; gap: 6px;\"><span style=\"width: 9px; height: 9px; border-radius: 50%; background: var(--color-accent-600);\"><\u002Fspan><span style=\"width: 9px; height: 9px; border-radius: 50%; background: var(--color-accent-600);\"><\u002Fspan><\u002Fspan><span style=\"font-size: 9px; font-weight: 800; letter-spacing: 0.06em; color: var(--color-accent-300);\">FRI<\u002Fspan><\u002Fspan>\n            <span class=\"nb-cube\" style=\"display: grid; gap: 5px; justify-items: center; align-content: start; width: 54px; padding: 6px 0 10px; border-radius: 14px; background: linear-gradient(160deg, var(--color-accent-700), var(--color-accent-900)); border: 3px solid var(--color-accent-900);\"><span style=\"display: flex; gap: 6px;\"><span style=\"width: 9px; height: 9px; border-radius: 50%; background: var(--color-accent-600);\"><\u002Fspan><span style=\"width: 9px; height: 9px; border-radius: 50%; background: var(--color-accent-600);\"><\u002Fspan><\u002Fspan><span style=\"font-size: 9px; font-weight: 800; letter-spacing: 0.06em; color: var(--color-accent-300);\">SAT<\u002Fspan><\u002Fspan>\n            <span class=\"nb-cube\" style=\"display: grid; gap: 5px; justify-items: center; align-content: start; width: 54px; padding: 6px 0 10px; border-radius: 14px; background: linear-gradient(160deg, var(--color-accent-700), var(--color-accent-900)); border: 3px solid var(--color-accent-900);\"><span style=\"display: flex; gap: 6px;\"><span style=\"width: 9px; height: 9px; border-radius: 50%; background: var(--color-accent-600);\"><\u002Fspan><span style=\"width: 9px; height: 9px; border-radius: 50%; background: var(--color-accent-600);\"><\u002Fspan><\u002Fspan><span style=\"font-size: 9px; font-weight: 800; letter-spacing: 0.06em; color: var(--color-accent-300);\">SUN<\u002Fspan><\u002Fspan>\n          <\u002Fdiv>\n          <p style=\"font-size: 12px; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase; margin: 18px 0 0; text-align: center; color: var(--color-accent-800);\">One brick a day, pack of seven<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"faq\" style=\"max-width: 1600px; margin: 0 auto; padding: clamp(28px, 4vw, 48px) clamp(20px, 5vw, 56px);\">\n    <span style=\"display: inline-block; background: var(--color-accent-900); color: var(--color-neutral-100); border-radius: 999px; padding: 5px 16px; font-size: 12px; font-weight: 800; letter-spacing: 0.12em; text-transform: uppercase;\">Parent questions<\u002Fspan>\n    <h2 style=\"font-family: var(--font-heading); font-weight: 400; font-size: clamp(32px, 4.6vw, 56px); line-height: 1.02; margin: 20px 0 clamp(24px, 3vw, 36px); max-width: 16ch;\">The bits parents ask first.<\u002Fh2>\n    <div style=\"display: grid; gap: 14px; max-width: 820px;\">\n      <details class=\"nb-faq\" style=\"background: var(--color-bg); border: 3px solid var(--color-accent-900); border-radius: 24px; box-shadow: 5px 5px 0 var(--color-accent-900); padding: 20px 26px;\">\n        <summary style=\"display: flex; justify-content: space-between; gap: 16px; font-family: var(--font-heading); font-weight: 400; font-size: 21px; line-height: 1.25;\">Is it safe for kids with nut allergies?<span style=\"color: var(--color-accent-600);\">+<\u002Fspan><\u002Fsummary>\n        <p style=\"font-size: 16px; line-height: 27px; margin: 14px 0 0;\"><strong style=\"font-weight: 800;\">Yes.<\u002Fstrong> NutriBrick is nut-free. The bind comes from sunflower seed butter, not peanut or tree nut butter.<\u002Fp>\n      <\u002Fdetails>\n      <details class=\"nb-faq\" style=\"background: var(--color-bg); border: 3px solid var(--color-accent-900); border-radius: 24px; box-shadow: 5px 5px 0 var(--color-accent-900); padding: 20px 26px;\">\n        <summary style=\"display: flex; justify-content: space-between; gap: 16px; font-family: var(--font-heading); font-weight: 400; font-size: 21px; line-height: 1.25;\">How long do the bricks keep?<span style=\"color: var(--color-accent-600);\">+<\u002Fspan><\u002Fsummary>\n        <p style=\"font-size: 16px; line-height: 27px; margin: 14px 0 0;\">Up to <strong style=\"font-weight: 800; background: var(--color-accent-100); border-radius: 8px; padding: 0 6px; margin-right: -4px;\">5 days in the fridge<\u002Fstrong>, or <strong style=\"font-weight: 800; background: var(--color-accent-2-100); border-radius: 8px; padding: 0 6px; margin-right: -4px;\">2 months in the freezer<\u002Fstrong>.<\u002Fp>\n      <\u002Fdetails>\n      <details class=\"nb-faq\" style=\"background: var(--color-bg); border: 3px solid var(--color-accent-900); border-radius: 24px; box-shadow: 5px 5px 0 var(--color-accent-900); padding: 20px 26px;\">\n        <summary style=\"display: flex; justify-content: space-between; gap: 16px; font-family: var(--font-heading); font-weight: 400; font-size: 21px; line-height: 1.25;\">What flavours are there?<span style=\"color: var(--color-accent-600);\">+<\u002Fspan><\u002Fsummary>\n        <p style=\"font-size: 16px; line-height: 27px; margin: 14px 0 0;\"><strong style=\"font-weight: 800;\">Chocolate and cinnamon<\u002Fstrong> at launch. One flavour, done properly, before we add more.<\u002Fp>\n      <\u002Fdetails>\n      <details class=\"nb-faq\" style=\"background: var(--color-bg); border: 3px solid var(--color-accent-900); border-radius: 24px; box-shadow: 5px 5px 0 var(--color-accent-900); padding: 20px 26px;\">\n        <summary style=\"display: flex; justify-content: space-between; gap: 16px; font-family: var(--font-heading); font-weight: 400; font-size: 21px; line-height: 1.25;\">Does it replace a meal?<span style=\"color: var(--color-accent-600);\">+<\u002Fspan><\u002Fsummary>\n        <p style=\"font-size: 16px; line-height: 27px; margin: 14px 0 0;\"><strong style=\"font-weight: 800;\">No.<\u002Fstrong> It is a nutrient-dense snack that sits between meals, not instead of them.<\u002Fp>\n      <\u002Fdetails>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section style=\"max-width: 1600px; margin: 0 auto; padding: clamp(28px, 4vw, 48px) clamp(20px, 5vw, 56px) clamp(40px, 6vw, 72px);\">\n    <div style=\"background: var(--color-accent-2-100); background-image: radial-gradient(var(--color-accent-2-200) 2.5px, transparent 2.6px); background-size: 22px 22px; border: 3px solid var(--color-accent-900); border-radius: 36px; padding: clamp(26px, 4vw, 52px); display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: clamp(20px, 4vw, 48px); align-items: center;\">\n      <div>\n        <span style=\"display: inline-block; background: var(--color-accent-2-600); color: var(--color-neutral-100); border-radius: 999px; padding: 5px 16px; font-size: 12px; font-weight: 800; letter-spacing: 0.12em; text-transform: uppercase;\">Why we made it<\u002Fspan>\n        <h2 style=\"font-family: var(--font-heading); font-weight: 400; font-size: clamp(26px, 3.4vw, 40px); line-height: 1.08; margin: 18px 0 0; max-width: 18ch;\">A Year 10 idea, built properly.<\u002Fh2>\n      <\u002Fdiv>\n      <p style=\"font-size: 18px; line-height: 31px; margin: 0; max-width: 44ch;\">NutriBrick started as a student venture through the Future Anything program. The brief was simple: <strong style=\"font-weight: 800;\">make something kids actually want to eat<\u002Fstrong>, without hiding what is in it from their parents. This site is the pitch, and the product is still a concept.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <footer style=\"background: var(--color-accent-900); background-image: radial-gradient(var(--color-accent-800) 2.5px, transparent 2.6px); background-size: 22px 22px; color: var(--color-neutral-100); border-top: 3px solid var(--color-accent-900);\">\n    <div style=\"max-width: 1600px; margin: 0 auto; padding: clamp(44px, 6vw, 72px) clamp(20px, 5vw, 56px) clamp(28px, 4vw, 40px); display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 32px; align-items: start;\">\n      <div>\n        <p style=\"font-family: var(--font-heading); font-weight: 400; font-size: clamp(34px, 5vw, 52px); line-height: 1; margin: 0;\">NutriBrick<\u002Fp>\n        <p style=\"font-size: 16px; line-height: 27px; margin: 14px 0 0; max-width: 28ch; color: color-mix(in srgb, var(--color-neutral-100) 80%, transparent);\">Made to play with, built to nourish. No junk bricks, ever.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"display: grid; gap: 10px; font-size: 15px; font-weight: 600;\">\n        <a href=\"#product\" class=\"nb-foot\" style=\"color: var(--color-accent-300);\">Product<\u002Fa>\n        <a href=\"#nutrition\" class=\"nb-foot\" style=\"color: var(--color-accent-300);\">Nutrition<\u002Fa>\n        <a href=\"#pricing\" class=\"nb-foot\" style=\"color: var(--color-accent-300);\">Pricing<\u002Fa>\n        <a href=\"#faq\" class=\"nb-foot\" style=\"color: var(--color-accent-300);\">FAQ<\u002Fa>\n      <\u002Fdiv>\n      <div style=\"display: grid; gap: 10px; font-size: 15px; color: color-mix(in srgb, var(--color-neutral-100) 80%, transparent);\">\n        <span>hello@nutribrick.example<\u002Fspan>\n        <span>@nutribrick<\u002Fspan>\n        <span style=\"margin-top: 12px; font-size: 13px; line-height: 22px;\">A Future Anything student venture. Concept product, not yet for sale.<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Ffooter>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;storeMode&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Content&quot;},&quot;showTestimonial&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Content&quot;},&quot;spinRate&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:0.3,&quot;min&quot;:0,&quot;max&quot;:0.8,&quot;step&quot;:0.05,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Motion&quot;}}\">\nclass Component extends DCLogic {\n  renderVals() {\n    const store = this.props.storeMode ?? false;\n    return {\n      isStore: store,\n      isPitch: !store,\n      showTestimonial: this.props.showTestimonial ?? true\n    };\n  }\n\n  componentDidMount() {\n    this._reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;\n    this._cleanup = [];\n    if (this._sweepTimer) clearInterval(this._sweepTimer);\n    (this._revealTimers || []).forEach(clearTimeout);\n    if (this._revealMo) this._revealMo.disconnect();\n    if (this._onScroll) {\n      window.removeEventListener('scroll', this._onScroll);\n      window.removeEventListener('resize', this._onScroll);\n    }\n    this._dead = false;\n    this._setupRings();\n    this._setupReveal();\n    this._setup3D();\n  }\n\n  _setupRings() {\n    const host = document.getElementById('nb-rings');\n    const rings = document.querySelectorAll('#nb-rings circle[data-ring]');\n    if (!host || !rings.length) return;\n    this._io = new IntersectionObserver((entries) => {\n      entries.forEach((e) => {\n        if (!e.isIntersecting) return;\n        rings.forEach((c) => { c.style.strokeDashoffset = '0'; });\n        this._io.disconnect();\n      });\n    }, { threshold: 0.3 });\n    this._io.observe(host);\n  }\n\n  _setupReveal() {\n    const root = document.getElementById('nb-page');\n    if (!root) return;\n    const show = (el) => {\n      el.style.opacity = '1';\n      el.style.transform = 'none';\n      el.dataset.nbShown = '1';\n    };\n    if (this._reduce || !('IntersectionObserver' in window)) {\n      this._revealAll = () => Array.from(root.children).forEach(show);\n      this._revealAll();\n      return;\n    }\n    const io = new IntersectionObserver((entries) => {\n      entries.forEach((e) => {\n        if (!e.isIntersecting) return;\n        show(e.target);\n        io.unobserve(e.target);\n      });\n    }, { threshold: 0.02, rootMargin: '0px 0px -4% 0px' });\n    this._revealIo = io;\n\n    const prime = () => {\n      Array.from(root.children).forEach((el) => {\n        if (el.tagName !== 'SECTION' && el.tagName !== 'FOOTER') return;\n        if (el.id === 'top' || el.dataset.nbShown || el.dataset.nbPrimed) return;\n        el.dataset.nbPrimed = '1';\n        el.style.opacity = '0';\n        el.style.transform = 'translateY(22px)';\n        el.style.transition = 'opacity 700ms ease, transform 700ms cubic-bezier(0.2, 0.7, 0.2, 1)';\n        io.observe(el);\n      });\n    };\n    prime();\n\n    const safety = () => {\n      const h = window.innerHeight;\n      Array.from(root.children).forEach((el) => {\n        if (el.dataset.nbShown) return;\n        if (el.getBoundingClientRect().top < h * 0.98) show(el);\n      });\n    };\n    this._revealAll = () => Array.from(root.children).forEach(show);\n\n    const mo = new MutationObserver(() => { prime(); safety(); });\n    mo.observe(root, { childList: true });\n    this._revealMo = mo;\n\n    let ticking = false;\n    this._onScroll = () => {\n      if (ticking) return;\n      ticking = true;\n      requestAnimationFrame(() => { ticking = false; safety(); });\n    };\n    window.addEventListener('scroll', this._onScroll, { passive: true });\n    window.addEventListener('resize', this._onScroll, { passive: true });\n\n    this._revealTimers = [\n      setTimeout(() => { prime(); safety(); }, 400),\n      setTimeout(() => { prime(); safety(); }, 1200),\n      setTimeout(() => { this._revealAll(); }, 2600)\n    ];\n  }\n\n  _cocoaTexture(THREE) {\n    const c = document.createElement('canvas');\n    c.width = 512; c.height = 512;\n    const x = c.getContext('2d');\n    const g = x.createLinearGradient(0, 0, 512, 512);\n    g.addColorStop(0, '#432009');\n    g.addColorStop(1, '#2a1206');\n    x.fillStyle = g;\n    x.fillRect(0, 0, 512, 512);\n    for (let i = 0; i < 900; i++) {\n      x.fillStyle = Math.random() > 0.5 ? 'rgba(38, 16, 6, 0.16)' : 'rgba(126, 68, 30, 0.14)';\n      x.beginPath();\n      x.arc(Math.random() * 512, Math.random() * 512, Math.random() * 7 + 2.5, 0, 6.2832);\n      x.fill();\n    }\n    const t = new THREE.CanvasTexture(c);\n    t.wrapS = t.wrapT = THREE.RepeatWrapping;\n    return t;\n  }\n\n  _labelTexture(THREE) {\n    const c = document.createElement('canvas');\n    c.width = 1024; c.height = 256;\n    const x = c.getContext('2d');\n    x.clearRect(0, 0, 1024, 256);\n    x.textAlign = 'center';\n    x.textBaseline = 'middle';\n    x.font = '400 130px Caprasimo, Georgia, serif';\n    x.fillStyle = 'rgba(247, 232, 210, 0.94)';\n    x.fillText('NutriBrick', 512, 136);\n    const t = new THREE.CanvasTexture(c);\n    t.anisotropy = 8;\n    return t;\n  }\n\n  _brick(THREE, RB, cols, rows, mat, studMat, labelMat) {\n    const g = new THREE.Group();\n    const W = cols, D = rows, H = 0.95;\n    const geo = RB ? new RB(W, H, D, 5, 0.11) : new THREE.BoxGeometry(W, H, D);\n    const body = new THREE.Mesh(geo, mat);\n    body.castShadow = true; body.receiveShadow = true;\n    g.add(body);\n    const studGeo = new THREE.CylinderGeometry(0.28, 0.3, 0.24, 40);\n    const capGeo = new THREE.SphereGeometry(0.28, 32, 12, 0, 6.2832, 0, 1.5708);\n    for (let i = 0; i < cols; i++) {\n      for (let j = 0; j < rows; j++) {\n        const px = -W / 2 + 0.5 + i;\n        const pz = -D / 2 + 0.5 + j;\n        const s = new THREE.Mesh(studGeo, studMat);\n        s.position.set(px, H / 2 + 0.11, pz);\n        s.castShadow = true; s.receiveShadow = true;\n        g.add(s);\n        const cap = new THREE.Mesh(capGeo, studMat);\n        cap.position.set(px, H / 2 + 0.23, pz);\n        cap.scale.set(1, 0.3, 1);\n        cap.castShadow = true;\n        g.add(cap);\n      }\n    }\n    if (labelMat) {\n      const lw = W * 0.66;\n      const lh = lw / 4;\n      const lg = new THREE.PlaneGeometry(lw, lh);\n      const front = new THREE.Mesh(lg, labelMat);\n      front.position.set(0, -0.02, D / 2 + 0.008);\n      g.add(front);\n      const back = new THREE.Mesh(lg, labelMat);\n      back.position.set(0, -0.02, -D / 2 - 0.008);\n      back.rotation.y = Math.PI;\n      g.add(back);\n    }\n    return g;\n  }\n\n  async _setup3D() {\n    const bases = [\n      '894a490e-56ff-42e4-9b53-51d466fa80d9',\n      '894a490e-56ff-42e4-9b53-51d466fa80d9',\n      '894a490e-56ff-42e4-9b53-51d466fa80d9'\n    ];\n    const rbPaths = [\n      '894a490e-56ff-42e4-9b53-51d466fa80d9',\n      '894a490e-56ff-42e4-9b53-51d466fa80d9',\n      '894a490e-56ff-42e4-9b53-51d466fa80d9'\n    ];\n    let THREE = null, RB = null, used = -1;\n    for (let i = 0; i < bases.length; i++) {\n      try {\n        const m = await import(bases[i]);\n        if (m && (m.WebGLRenderer || (m.default && m.default.WebGLRenderer))) {\n          THREE = m.WebGLRenderer ? m : m.default;\n          used = i;\n          break;\n        }\n      } catch (err) { /* try next CDN */ }\n    }\n    if (!THREE) {\n      console.warn('NutriBrick: three.js could not load from any CDN, keeping flat bricks');\n      return;\n    }\n    for (let i = used; i < rbPaths.length; i++) {\n      try {\n        const m = await import(rbPaths[i]);\n        if (m && m.RoundedBoxGeometry) { RB = m.RoundedBoxGeometry; break; }\n      } catch (err) { /* rounded box is optional */ }\n    }\n    try { if (document.fonts && document.fonts.load) await document.fonts.load('130px Caprasimo'); } catch (err) {}\n    if (this._dead) return;\n    const tex = this._cocoaTexture(THREE);\n    const jobs = [\n      ['nb-hero-3d', 'nb-hero-fallback', 'single'],\n      ['nb-stack-3d', 'nb-stack-fallback', 'stack'],\n      ['nb-tower-3d', 'nb-tower-fallback', 'tower']\n    ];\n    this._live = this._live || {};\n    const sweep = () => {\n      if (this._dead) return;\n      jobs.forEach((j) => {\n        const host = document.getElementById(j[0]);\n        if (!host) return;\n        if (host.querySelector('canvas')) return;\n        const prev = this._live[j[0]];\n        if (prev) { try { prev(); } catch (e) {} this._live[j[0]] = null; }\n        this._mountScene(THREE, RB, tex, j[0], j[1], j[2]);\n      });\n    };\n    sweep();\n    this._sweepTimer = setInterval(sweep, 700);\n  }\n\n  _mountScene(THREE, RB, tex, hostId, fallbackId, mode) {\n    const host = document.getElementById(hostId);\n    if (!host) return;\n    host.style.display = 'block';\n    const width = host.clientWidth || 420;\n    const height = host.clientHeight || 380;\n\n    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });\n    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));\n    renderer.setSize(width, height, false);\n    renderer.shadowMap.enabled = true;\n    renderer.shadowMap.type = THREE.PCFSoftShadowMap;\n    if ('outputColorSpace' in renderer) renderer.outputColorSpace = THREE.SRGBColorSpace;\n    if (THREE.ACESFilmicToneMapping) { renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.0; }\n    const cv = renderer.domElement;\n    cv.style.width = '100%'; cv.style.height = '100%'; cv.style.display = 'block';\n    host.appendChild(cv);\n    const fb = document.getElementById(fallbackId);\n    if (fb) fb.style.display = 'none';\n\n    const scene = new THREE.Scene();\n    const camera = new THREE.PerspectiveCamera(30, width / height, 0.1, 60);\n    if (mode === 'tower') { camera.position.set(0, 1.4, 14); camera.lookAt(0, -0.15, 0); }\n    else if (mode === 'stack') { camera.position.set(0, 3.4, 10.6); camera.lookAt(0, 0.15, 0); }\n    else { camera.position.set(0, 2.7, 9.2); camera.lookAt(0, -0.05, 0); }\n\n    scene.add(new THREE.HemisphereLight(0xfff1dc, 0x6b4a30, 0.75));\n    const key = new THREE.DirectionalLight(0xfff4e6, 2.1);\n    key.position.set(4.5, 8, 6);\n    key.castShadow = true;\n    key.shadow.mapSize.set(1024, 1024);\n    key.shadow.bias = -0.0016;\n    key.shadow.radius = 3;\n    const sc = key.shadow.camera;\n    sc.left = -7; sc.right = 7; sc.top = 7; sc.bottom = -7; sc.near = 0.5; sc.far = 26;\n    scene.add(key);\n    const fill = new THREE.DirectionalLight(0xffd9b8, 0.55);\n    fill.position.set(-6, 3, -4);\n    scene.add(fill);\n\n    const mat = new THREE.MeshStandardMaterial({ map: tex, bumpMap: tex, bumpScale: 0.012, roughness: 0.44, metalness: 0.03 });\n    const studMat = new THREE.MeshStandardMaterial({ map: tex, bumpMap: tex, bumpScale: 0.01, roughness: 0.38, metalness: 0.03 });\n    const labelMat = new THREE.MeshStandardMaterial({ map: this._labelTexture(THREE), transparent: true, roughness: 0.5, metalness: 0.0, depthWrite: false });\n\n    const grp = new THREE.Group();\n    let lamp = null, lampLight = null;\n    if (mode === 'tower') {\n      const ys = [-2.3, -1.15, 0, 1.15];\n      for (let i = 0; i < ys.length; i++) {\n        const b = this._brick(THREE, RB, 2, 2, mat, studMat, i === 3 ? labelMat : null);\n        b.position.y = ys[i];\n        b.rotation.y = i * 0.05 - 0.07;\n        grp.add(b);\n      }\n      const lampMat = new THREE.MeshStandardMaterial({ color: 0xffe0a8, emissive: 0xffcf7a, emissiveIntensity: 1.3, roughness: 0.35 });\n      lamp = new THREE.Mesh(new THREE.CylinderGeometry(0.52, 0.6, 0.62, 28), lampMat);\n      lamp.position.y = 1.15 + 0.95 / 2 + 0.55;\n      grp.add(lamp);\n      const roof = new THREE.Mesh(new THREE.ConeGeometry(0.72, 0.55, 28), mat);\n      roof.position.y = lamp.position.y + 0.58;\n      roof.castShadow = true;\n      grp.add(roof);\n      lampLight = new THREE.PointLight(0xffcf7a, 6, 9, 2);\n      lampLight.position.copy(lamp.position);\n      grp.add(lampLight);\n    } else if (mode === 'stack') {\n      const ys = [-1.15, 0, 1.15];\n      const rs = [0.06, -0.05, 0.04];\n      for (let i = 0; i < 3; i++) {\n        const b = this._brick(THREE, RB, 2, 2, mat, studMat, labelMat);\n        b.position.y = ys[i];\n        b.rotation.y = rs[i];\n        grp.add(b);\n      }\n    } else {\n      grp.add(this._brick(THREE, RB, 4, 2, mat, studMat, labelMat));\n    }\n    scene.add(grp);\n\n    const ground = new THREE.Mesh(new THREE.PlaneGeometry(40, 40), new THREE.ShadowMaterial({ opacity: 0.2 }));\n    ground.rotation.x = -Math.PI / 2;\n    ground.position.y = mode === 'tower' ? -3.0 : (mode === 'stack' ? -1.85 : -0.72);\n    ground.receiveShadow = true;\n    scene.add(ground);\n\n    let visible = true;\n    const vio = new IntersectionObserver((es) => { visible = es[0].isIntersecting; }, { threshold: 0 });\n    vio.observe(host);\n\n    const ro = new ResizeObserver(() => {\n      const w = host.clientWidth || width;\n      const h = host.clientHeight || height;\n      renderer.setSize(w, h, false);\n      camera.aspect = w / h;\n      camera.updateProjectionMatrix();\n    });\n    ro.observe(host);\n\n    const base = mode === 'tower' ? 0.3 : (mode === 'stack' ? 0.55 : -0.55);\n    let rot = base;\n    let raf = 0;\n    const t0 = performance.now();\n    const tick = () => {\n      raf = requestAnimationFrame(tick);\n      if (!visible) return;\n      const spin = this.props.spinRate ?? 0.3;\n      const y = this._reduce ? 0 : (window.scrollY || 0);\n      const dir = mode === 'single' ? 1 : -1;\n      const idle = this._reduce ? 0 : ((performance.now() - t0) / 1000) * 0.16 * dir;\n      const target = base + idle + y * spin * 0.0075 * dir;\n      rot += (target - rot) * 0.11;\n      grp.rotation.y = rot;\n      grp.rotation.x = mode === 'stack' ? -0.03 : -0.05;\n      grp.position.y = this._reduce ? 0 : Math.sin(performance.now() / 1700) * 0.05;\n      if (lampLight) {\n        const pulse = 0.55 + 0.45 * (0.5 + 0.5 * Math.sin(performance.now() / 620));\n        lampLight.intensity = 3 + pulse * 6;\n        if (lamp) lamp.material.emissiveIntensity = 0.7 + pulse * 1.2;\n      }\n      renderer.render(scene, camera);\n    };\n    tick();\n\n    const teardown = () => {\n      cancelAnimationFrame(raf);\n      vio.disconnect();\n      ro.disconnect();\n      renderer.dispose();\n      if (cv.parentNode) cv.parentNode.removeChild(cv);\n    };\n    this._live = this._live || {};\n    this._live[hostId] = teardown;\n    this._cleanup.push(teardown);\n  }\n\n  componentWillUnmount() {\n    this._dead = true;\n    if (this._sweepTimer) clearInterval(this._sweepTimer);\n    if (this._onScroll) {\n      window.removeEventListener('scroll', this._onScroll);\n      window.removeEventListener('resize', this._onScroll);\n    }\n    (this._revealTimers || []).forEach(clearTimeout);\n    if (this._revealMo) this._revealMo.disconnect();\n    if (this._io) this._io.disconnect();\n    if (this._revealIo) this._revealIo.disconnect();\n    (this._cleanup || []).forEach((fn) => { try { fn(); } catch (e) {} });\n  }\n}\n<\u002Fscript>\n\n\n<script>\n(function () {\n  // Delegated so it survives any re-render of the nav.\n  function menu() { return document.getElementById('nb-mobile-menu'); }\n  function btn() { return document.querySelector('.nb-menu-btn'); }\n  function set(open) {\n    var m = menu(), b = btn();\n    if (!m || !b) return;\n    m.classList.toggle('is-open', open);\n    b.setAttribute('aria-expanded', open ? 'true' : 'false');\n    b.setAttribute('aria-label', open ? 'Close menu' : 'Open menu');\n  }\n  document.addEventListener('click', function (e) {\n    var b = e.target.closest && e.target.closest('.nb-menu-btn');\n    if (b) { set(b.getAttribute('aria-expanded') !== 'true'); return; }\n    var m = menu();\n    if (!m || !m.classList.contains('is-open')) return;\n    if (e.target.closest && e.target.closest('#nb-mobile-menu a')) { set(false); return; }\n    if (!(e.target.closest && e.target.closest('#nb-mobile-menu'))) set(false);\n  });\n  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') set(false); });\n  var mq = window.matchMedia('(min-width: 621px)');\n  var onChange = function (e) { if (e.matches) set(false); };\n  if (mq.addEventListener) mq.addEventListener('change', onChange); else mq.addListener(onChange);\n})();\n<\u002Fscript><\u002Fbody><\u002Fhtml>"
