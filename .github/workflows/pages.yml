name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/nutribrick-github-pages-7nioc7]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No enablement: here — creating the Pages site needs repo-admin
      # rights, which GITHUB_TOKEN does not have ("Resource not accessible
      # by integration"). Pages must be switched on once, by hand, with
      # Settings -> Pages -> Source: GitHub Actions.
      - uses: actions/configure-pages@v5

      # The site is a single self-contained index.html at the repo root; the
      # source export under src/ is not part of what gets served.
      - name: Stage site
        run: |
          mkdir -p _site
          cp index.html .nojekyll _site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
